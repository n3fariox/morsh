name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name != 'main' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.15.2"
  PROTOC_VERSION: "29.3"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            zig_arch: x86_64-linux
            zig_ext: tar.xz
            allow_fail: false
          - os: windows-latest
            zig_arch: x86_64-windows
            zig_ext: zip
            allow_fail: true
    continue-on-error: ${{ matrix.allow_fail }}

    steps:
      - name: Checkout submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PROTOC_ARCH="win64"
          else
            PROTOC_ARCH="linux-x86_64"
          fi
          PROTOC_URL="https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-${PROTOC_ARCH}.zip"
          echo "Downloading protoc from $PROTOC_URL"
          curl -fsSL "$PROTOC_URL" -o "$RUNNER_TEMP/protoc.zip"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z x "$RUNNER_TEMP/protoc.zip" -o"$RUNNER_TEMP/protoc" -y
          else
            unzip -o "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          fi
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"

      - name: Install zig
        shell: bash
        run: |
          ZIG_URL="https://ziglang.org/download/${{ env.ZIG_VERSION }}/zig-${{ matrix.zig_arch }}-${{ env.ZIG_VERSION }}.${{ matrix.zig_ext }}"
          echo "Downloading zig from $ZIG_URL"
          if [[ "${{ matrix.zig_ext }}" == "tar.xz" ]]; then
            curl -fsSL "$ZIG_URL" | tar -xJ -C "$RUNNER_TEMP"
          else
            curl -fsSL "$ZIG_URL" -o "$RUNNER_TEMP/zig.zip"
            7z x "$RUNNER_TEMP/zig.zip" -o"$RUNNER_TEMP" -y
          fi
          echo "$RUNNER_TEMP/zig-${{ matrix.zig_arch }}-${{ env.ZIG_VERSION }}" >> "$GITHUB_PATH"

      - name: Cache zig
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: zig-${{ env.ZIG_VERSION }}-${{ matrix.os }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        shell: bash
        run: cargo build --workspace
        env:
          GHOSTTY_SOURCE_DIR: ${{ github.workspace }}/third_party/ghostty
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache

      - name: Test
        shell: bash
        run: cargo test --workspace
        env:
          GHOSTTY_SOURCE_DIR: ${{ github.workspace }}/third_party/ghostty
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache

      - name: Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          GHOSTTY_SOURCE_DIR: ${{ github.workspace }}/third_party/ghostty
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache
