name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name != 'main' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.15.2"
  GHOSTTY_COMMIT: "fdbf9ff3a31d7531b691cb49c98fc465a1a503a0"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            zig_arch: linux-x86_64
            zig_ext: tar.xz
            zig_dir: zig-linux-x86_64-${{ env.ZIG_VERSION }}
            zig_global_cache: ~/.cache/zig
            allow_fail: false
          - os: windows-latest
            zig_arch: windows-x86_64
            zig_ext: zip
            zig_dir: zig-windows-x86_64-${{ env.ZIG_VERSION }}
            zig_global_cache: ${{ runner.temp }}\\zig-global-cache
            allow_fail: true
    continue-on-error: ${{ matrix.allow_fail }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.x"

      - name: Install zig
        shell: bash
        run: |
          ZIG_URL="https://ziglang.org/download/${{ env.ZIG_VERSION }}/zig-${{ matrix.zig_arch }}-${{ env.ZIG_VERSION }}.${{ matrix.zig_ext }}"
          echo "Downloading zig from $ZIG_URL"
          if [[ "${{ matrix.zig_ext }}" == "tar.xz" ]]; then
            curl -fsSL "$ZIG_URL" | tar -xJ -C "$RUNNER_TEMP"
          else
            curl -fsSL "$ZIG_URL" -o "$RUNNER_TEMP/zig.zip"
            7z x "$RUNNER_TEMP/zig.zip" -o"$RUNNER_TEMP" -y
          fi
          echo "$RUNNER_TEMP/${{ matrix.zig_dir }}" >> "$GITHUB_PATH"

      - name: Cache zig
        uses: actions/cache@v4
        with:
          path: ${{ matrix.zig_global_cache }}
          key: zig-${{ env.ZIG_VERSION }}-${{ matrix.os }}

      - name: Clone ghostty
        shell: bash
        run: |
          GHOSTTY_SRC="${{ runner.temp }}/ghostty"
          if [ ! -d "$GHOSTTY_SRC" ] || [ ! -f "$GHOSTTY_SRC/.ghostty-commit" ] || [ "$(cat "$GHOSTTY_SRC/.ghostty-commit")" != "${{ env.GHOSTTY_COMMIT }}" ]; then
            rm -rf "$GHOSTTY_SRC"
            git clone --filter=blob:none https://github.com/ghostty-org/ghostty.git "$GHOSTTY_SRC"
            git -C "$GHOSTTY_SRC" checkout ${{ env.GHOSTTY_COMMIT }}
            echo "${{ env.GHOSTTY_COMMIT }}" > "$GHOSTTY_SRC/.ghostty-commit"
          fi

      - name: Cache ghostty source
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ghostty
          key: ghostty-${{ env.GHOSTTY_COMMIT }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        shell: bash
        run: cargo build --workspace
        env:
          GHOSTTY_SOURCE_DIR: ${{ runner.temp }}/ghostty
          ZIG_GLOBAL_CACHE_DIR: ${{ matrix.zig_global_cache }}

      - name: Test
        shell: bash
        run: cargo test --workspace
        env:
          GHOSTTY_SOURCE_DIR: ${{ runner.temp }}/ghostty
          ZIG_GLOBAL_CACHE_DIR: ${{ matrix.zig_global_cache }}
