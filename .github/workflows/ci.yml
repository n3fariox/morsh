name: CI

on:
  push:
    branches: [main]
  pull_request: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name != 'main' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.15.2"
  PROTOC_VERSION: "29.3"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            zig_arch: x86_64-linux
            zig_ext: tar.xz
            allow_fail: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            zig_arch: x86_64-windows
            zig_ext: zip
            allow_fail: true
          - os: macos-15
            target: aarch64-apple-darwin
            zig_arch: aarch64-macos
            zig_ext: tar.xz
            allow_fail: false
          - os: macos-15
            target: x86_64-apple-darwin
            zig_arch: x86_64-macos
            zig_ext: tar.xz
            allow_fail: false
    continue-on-error: ${{ matrix.allow_fail }}

    steps:
      - name: Checkout submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install protoc
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) PROTOC_ARCH="win64" ;;
            macOS)   PROTOC_ARCH="osx-x86_64" ;;
            *)       PROTOC_ARCH="linux-x86_64" ;;
          esac
          PROTOC_URL="https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-${PROTOC_ARCH}.zip"
          echo "Downloading protoc from $PROTOC_URL"
          curl -fsSL "$PROTOC_URL" -o "$RUNNER_TEMP/protoc.zip"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z x "$RUNNER_TEMP/protoc.zip" -o"$RUNNER_TEMP/protoc" -y
          else
            unzip -o "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          fi
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"

      - name: Install zig
        shell: bash
        run: |
          ZIG_URL="https://ziglang.org/download/${{ env.ZIG_VERSION }}/zig-${{ matrix.zig_arch }}-${{ env.ZIG_VERSION }}.${{ matrix.zig_ext }}"
          echo "Downloading zig from $ZIG_URL"
          if [[ "${{ matrix.zig_ext }}" == "tar.xz" ]]; then
            curl -fsSL "$ZIG_URL" | tar -xJ -C "$RUNNER_TEMP"
          else
            curl -fsSL "$ZIG_URL" -o "$RUNNER_TEMP/zig.zip"
            7z x "$RUNNER_TEMP/zig.zip" -o"$RUNNER_TEMP" -y
          fi
          echo "$RUNNER_TEMP/zig-${{ matrix.zig_arch }}-${{ env.ZIG_VERSION }}" >> "$GITHUB_PATH"

      - name: Cache zig
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: zig-${{ env.ZIG_VERSION }}-${{ matrix.os }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install musl-gcc (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: Workaround zig 0.15.2 + macOS 26 SDK linker failure
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # zig 0.15.2 cannot link against the macOS 26 SDK: every libc symbol
          # (_abort, _malloc_size, __availability_version_check, dispatch/*)
          # comes back undefined. The Command Line Tools SDK still links fine,
          # so steer zig at it via DEVELOPER_DIR.
          if [ -d /Library/Developer/CommandLineTools ]; then
            echo "DEVELOPER_DIR=/Library/Developer/CommandLineTools" >> "$GITHUB_ENV"
          fi

      - name: Build
        shell: bash
        run: cargo build --workspace --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          GHOSTTY_SOURCE_DIR: ${{ github.workspace }}/third_party/ghostty
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache

      - name: Test
        shell: bash
        run: cargo test --workspace --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          GHOSTTY_SOURCE_DIR: ${{ github.workspace }}/third_party/ghostty
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache

      - name: Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          GHOSTTY_SOURCE_DIR: ${{ github.workspace }}/third_party/ghostty
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache
