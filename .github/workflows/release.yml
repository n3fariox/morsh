name: Release

on:
  push:
    tags:
      - "v*"

env:
  ZIG_VERSION: "0.15.2"
  GHOSTTY_COMMIT: "fdbf9ff3a31d7531b691cb49c98fc465a1a503a0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            zig_arch: x86_64-linux
            zig_ext: tar.xz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            zig_arch: x86_64-windows
            zig_ext: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.x"

      - name: Install zig
        shell: bash
        run: |
          ZIG_URL="https://ziglang.org/download/${{ env.ZIG_VERSION }}/zig-${{ matrix.zig_arch }}-${{ env.ZIG_VERSION }}.${{ matrix.zig_ext }}"
          echo "Downloading zig from $ZIG_URL"
          if [[ "${{ matrix.zig_ext }}" == "tar.xz" ]]; then
            curl -fsSL "$ZIG_URL" | tar -xJ -C "$RUNNER_TEMP"
          else
            curl -fsSL "$ZIG_URL" -o "$RUNNER_TEMP/zig.zip"
            7z x "$RUNNER_TEMP/zig.zip" -o"$RUNNER_TEMP" -y
          fi
          echo "$RUNNER_TEMP/zig-${{ matrix.zig_arch }}-${{ env.ZIG_VERSION }}" >> "$GITHUB_PATH"

      - name: Cache zig
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: zig-${{ env.ZIG_VERSION }}-${{ matrix.os }}

      - name: Clone ghostty
        shell: bash
        run: |
          GHOSTTY_SRC="${{ runner.temp }}/ghostty"
          if [ ! -d "$GHOSTTY_SRC" ] || [ ! -f "$GHOSTTY_SRC/.ghostty-commit" ] || [ "$(cat "$GHOSTTY_SRC/.ghostty-commit")" != "${{ env.GHOSTTY_COMMIT }}" ]; then
            rm -rf "$GHOSTTY_SRC"
            git clone --filter=blob:none https://github.com/ghostty-org/ghostty.git "$GHOSTTY_SRC"
            git -C "$GHOSTTY_SRC" checkout ${{ env.GHOSTTY_COMMIT }}
            echo "${{ env.GHOSTTY_COMMIT }}" > "$GHOSTTY_SRC/.ghostty-commit"
          fi

      - name: Cache ghostty source
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ghostty
          key: ghostty-${{ env.GHOSTTY_COMMIT }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (Linux musl)
        if: runner.os == 'Linux'
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}
        env:
          GHOSTTY_SOURCE_DIR: ${{ runner.temp }}/ghostty
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache
          CC: zig
          CFLAGS: "-target x86_64-linux-musl"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: zig

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}
        env:
          GHOSTTY_SOURCE_DIR: ${{ runner.temp }}/ghostty
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          STAGING="morsh-${TAG}-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp target/${{ matrix.target }}/release/morsh \
             target/${{ matrix.target }}/release/morsh-client \
             target/${{ matrix.target }}/release/morsh-server \
             "$STAGING/"
          tar czf "${STAGING}.tar.gz" "$STAGING"
          echo "ASSET=${STAGING}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          STAGING="morsh-${TAG}-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp target/${{ matrix.target }}/release/morsh.exe \
             target/${{ matrix.target }}/release/morsh-client.exe \
             target/${{ matrix.target }}/release/morsh-server.exe \
             "$STAGING/"
          7z a "${STAGING}.zip" "$STAGING"
          echo "ASSET=${STAGING}.zip" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: morsh-${{ matrix.target }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
