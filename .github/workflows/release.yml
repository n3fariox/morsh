name: Release

on:
  push:
    tags:
      - "v*"

env:
  ZIG_VERSION: "0.15.2"
  PROTOC_VERSION: "29.3"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            zig_arch: x86_64-linux
            zig_ext: tar.xz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            zig_arch: x86_64-windows
            zig_ext: zip
          - target: aarch64-apple-darwin
            os: macos-latest
            zig_arch: aarch64-macos
            zig_ext: tar.xz
          - target: x86_64-apple-darwin
            os: macos-latest
            zig_arch: x86_64-macos
            zig_ext: tar.xz

    steps:
      - name: Checkout submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install protoc
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) PROTOC_ARCH="win64" ;;
            macOS)   PROTOC_ARCH="osx-x86_64" ;;
            *)       PROTOC_ARCH="linux-x86_64" ;;
          esac
          PROTOC_URL="https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-${PROTOC_ARCH}.zip"
          echo "Downloading protoc from $PROTOC_URL"
          curl -fsSL "$PROTOC_URL" -o "$RUNNER_TEMP/protoc.zip"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z x "$RUNNER_TEMP/protoc.zip" -o"$RUNNER_TEMP/protoc" -y
          else
            unzip -o "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          fi
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"

      - name: Install zig
        shell: bash
        run: |
          ZIG_URL="https://ziglang.org/download/${{ env.ZIG_VERSION }}/zig-${{ matrix.zig_arch }}-${{ env.ZIG_VERSION }}.${{ matrix.zig_ext }}"
          echo "Downloading zig from $ZIG_URL"
          if [[ "${{ matrix.zig_ext }}" == "tar.xz" ]]; then
            curl -fsSL "$ZIG_URL" | tar -xJ -C "$RUNNER_TEMP"
          else
            curl -fsSL "$ZIG_URL" -o "$RUNNER_TEMP/zig.zip"
            7z x "$RUNNER_TEMP/zig.zip" -o"$RUNNER_TEMP" -y
          fi
          echo "$RUNNER_TEMP/zig-${{ matrix.zig_arch }}-${{ env.ZIG_VERSION }}" >> "$GITHUB_PATH"

      - name: Cache zig
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: zig-${{ env.ZIG_VERSION }}-${{ matrix.os }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install musl-gcc (Linux musl)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: Build (Linux musl)
        if: runner.os == 'Linux'
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          GHOSTTY_SOURCE_DIR: ${{ github.workspace }}/third_party/ghostty
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}
        env:
          GHOSTTY_SOURCE_DIR: ${{ github.workspace }}/third_party/ghostty
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          STAGING="morsh-${TAG}-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp target/${{ matrix.target }}/release/morsh \
             target/${{ matrix.target }}/release/morsh-client \
             target/${{ matrix.target }}/release/morsh-server \
             "$STAGING/"
          tar czf "${STAGING}.tar.gz" "$STAGING"
          echo "ASSET=${STAGING}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          STAGING="morsh-${TAG}-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp target/${{ matrix.target }}/release/morsh.exe \
             target/${{ matrix.target }}/release/morsh-client.exe \
             target/${{ matrix.target }}/release/morsh-server.exe \
             "$STAGING/"
          7z a "${STAGING}.zip" "$STAGING"
          echo "ASSET=${STAGING}.zip" >> "$GITHUB_ENV"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          STAGING="morsh-${TAG}-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp target/${{ matrix.target }}/release/morsh \
             target/${{ matrix.target }}/release/morsh-client \
             target/${{ matrix.target }}/release/morsh-server \
             "$STAGING/"
          tar czf "${STAGING}.tar.gz" "$STAGING"
          echo "ASSET=${STAGING}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: morsh-${{ matrix.target }}
          path: ${{ env.ASSET }}

  universal-macos:
    needs: build
    runs-on: macos-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create universal binaries
        run: |
          TAG="${GITHUB_REF_NAME}"
          STAGING="morsh-${TAG}-universal-apple-darwin"
          mkdir -p "$STAGING"

          for bin in morsh morsh-client morsh-server; do
            lipo -create \
              "artifacts/morsh-${TAG}-aarch64-apple-darwin/morsh-${TAG}-aarch64-apple-darwin/${bin}" \
              "artifacts/morsh-${TAG}-x86_64-apple-darwin/morsh-${TAG}-x86_64-apple-darwin/${bin}" \
              -output "$STAGING/${bin}"
            lipo -info "$STAGING/${bin}"
          done

          tar czf "${STAGING}.tar.gz" "$STAGING"
          echo "ASSET=${STAGING}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: morsh-universal-apple-darwin
          path: ${{ env.ASSET }}

  release:
    needs: [build, universal-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
