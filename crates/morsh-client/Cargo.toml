[package]
name = "morsh-client"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Morsh client binary"

[[bin]]
name = "morsh-client"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["net", "time", "macros", "rt-multi-thread", "sync", "signal"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
morsh-crypto = { path = "../morsh-crypto" }
morsh-proto = { path = "../morsh-proto" }
morsh-terminal = { path = "../morsh-terminal" }
morsh-network = { path = "../morsh-network" }
morsh-statesync = { path = "../morsh-statesync" }
morsh-prediction = { path = "../morsh-prediction" }
prost = "0.14"
tracing = "0.1"
morsh-log = { path = "../morsh-log" }
