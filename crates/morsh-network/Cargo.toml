[package]
name = "morsh-network"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "UDP transport layer for morsh"

[dependencies]
tokio = { version = "1", features = ["net", "time", "macros", "rt", "sync"] }
morsh-crypto = { path = "../morsh-crypto" }
morsh-proto = { path = "../morsh-proto" }
prost = "0.14"
flate2 = "1"
tracing = "0.1"
socket2 = "0.5"
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }
