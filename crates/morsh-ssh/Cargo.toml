[package]
name = "morsh-ssh"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Pure-Rust SSH connectivity using russh. Replaces system ssh(1) dependency."

[dependencies]
tracing = "0.1"
russh = { version = "0.62", default-features = false, features = ["ring", "rsa"] }
russh-keys = "0.49"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
libc = "0.2"
