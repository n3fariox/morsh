[package]
name = "morsh-statesync"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "State synchronization protocol for morsh"

[dependencies]
morsh-proto = { path = "../morsh-proto" }
morsh-terminal = { path = "../morsh-terminal" }
morsh-network = { path = "../morsh-network" }
prost = "0.14"
tracing = "0.1"

[dev-dependencies]
serial_test = "3"
morsh-crypto = { path = "../morsh-crypto" }
serde_json = "1"
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt"] }

[[bench]]
name = "performance"
harness = false
