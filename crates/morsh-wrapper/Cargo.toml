[package]
name = "morsh-wrapper"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Morsh wrapper binary (replaces mosh.pl) - SSH launch + connection"

[[bin]]
name = "morsh"
path = "src/main.rs"

[features]
default = ["russh"]
russh = ["dep:morsh-ssh"]

[dependencies]
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
morsh-log = { path = "../morsh-log" }
morsh-ssh = { path = "../morsh-ssh", optional = true }
