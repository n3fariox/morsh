[package]
name = "mosh-network"
version = "0.1.0"
edition = "2021"
description = "UDP transport layer for mosh-rust"

[dependencies]
tokio = { version = "1", features = ["net", "time", "macros", "rt", "sync"] }
mosh-crypto = { path = "../mosh-crypto" }
mosh-proto = { path = "../mosh-proto" }
prost = "0.14"
flate2 = "1"
log = "0.4"
socket2 = "0.5"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
