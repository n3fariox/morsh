[package]
name = "mosh-server"
version = "0.1.0"
edition = "2021"
description = "Mosh server binary"

[[bin]]
name = "mosh-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["net", "time", "macros", "rt-multi-thread", "sync", "signal", "fs", "io-util"] }
portable-pty = "0.8"
mosh-crypto = { path = "../mosh-crypto" }
mosh-proto = { path = "../mosh-proto" }
mosh-terminal = { path = "../mosh-terminal" }
mosh-network = { path = "../mosh-network" }
mosh-statesync = { path = "../mosh-statesync" }
prost = "0.14"
log = "0.4"
env_logger = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }
